# Testes/typecheck dos dois projetos. O deploy em produção é feito pelo
# Workers Builds (dashboard Cloudflare), que escuta pushes na main — não há
# deploy aqui, então não precisa de CLOUDFLARE_API_TOKEN no repo.
name: check-mcps

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'Github/**'
      - '.github/workflows/deploy-mcps.yml'
  pull_request:
    paths:
      - 'worker/**'
      - 'Github/**'

jobs:
  github-mcp:
    name: Github (domínio)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Github
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check

  worker:
    name: Worker (auth + MCPs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run test:integration
