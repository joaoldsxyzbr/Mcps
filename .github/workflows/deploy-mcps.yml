# Testes/typecheck do monorepo. O deploy em produção é feito pelo Workers
# Builds (dashboard Cloudflare), que escuta pushes na main — não há deploy
# aqui, então não precisa de CLOUDFLARE_API_TOKEN no repo.
#
# `npm run check` roda typecheck + testes unitários dos dois projetos.
# A integração sobe `wrangler dev` e roda num passo separado, para que uma
# falha aponte direto para o lado certo.
name: check-mcps

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'Github/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-mcps.yml'
  pull_request:
    paths:
      - 'worker/**'
      - 'Github/**'
      - 'package.json'
      - 'package-lock.json'

env:
  NODE_VERSION: '24'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  check:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Workspaces: um install cobre worker e Github.
      - run: npm install
      - run: npm run check
      - run: npm run test:integration
