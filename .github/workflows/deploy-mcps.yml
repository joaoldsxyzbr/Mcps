name: deploy-mcps

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'Github/**'
      - '.github/workflows/deploy-mcps.yml'
  pull_request:
    paths:
      - 'worker/**'
      - 'Github/**'

jobs:
  github-mcp:
    name: Github (domínio)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Github
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check

  worker:
    name: Worker (auth + MCPs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run test:integration
      - name: Deploy para o Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
